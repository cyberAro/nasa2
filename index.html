<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriShift - NASA Space Apps</title>
    <style>
        /* Base Reset & Font */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #2e7d32 0%, #1565c0 100%);
            color: #333; 
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* --- NAVIGATION MENU STYLES --- */
        .navbar {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }
        .hamburger {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            font-weight: bold;
            color: #1565c0;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .hamburger:hover { background: #fff; }
        .dropdown {
            display: none; /* Hidden by default */
            flex-direction: column;
            background: rgba(255, 255, 255, 0.95);
            margin-top: 10px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 200px;
        }
        .dropdown.show { display: flex; }
        .dropdown button {
            background: none; color: #333; border: none; padding: 15px 20px;
            text-align: left; font-size: 16px; font-weight: 500;
            box-shadow: none; margin: 0; border-radius: 0;
            border-bottom: 1px solid #eee;
        }
        .dropdown button:last-child { border-bottom: none; }
        .dropdown button:hover { background: #f0f0f0; transform: none; color: #1565c0; }

        /* Frosted Glass Card */
        .card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px; 
            border-radius: 16px; 
            max-width: 600px; 
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
            margin-top: 40px; /* Space for the floating menu */
        }

        /* View Toggling */
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Typography & Colors */
        h1 { color: #1565c0; font-size: 2.2rem; margin-bottom: 5px; }
        .subtitle { color: #555; font-size: 1.1rem; margin-bottom: 25px; font-weight: 500; }
        h3 { color: #2e7d32; margin-top: 25px; border-bottom: 2px solid #e0e0e0; padding-bottom: 8px; }
        
        /* Inputs & Main Buttons */
        label { font-weight: bold; color: #444; display: block; margin-bottom: 8px; }
        select { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 2px solid #ccc; outline: none; }
        .primary-btn { 
            width: 100%; padding: 14px; margin-top: 20px; font-size: 18px; font-weight: bold;
            background: linear-gradient(90deg, #ff8f00, #ffb300); color: white; border: none; 
            cursor: pointer; border-radius: 8px; box-shadow: 0 4px 15px rgba(255, 143, 0, 0.4);
            transition: transform 0.2s;
        }
        .primary-btn:hover { transform: translateY(-2px); }

        /* Results Styling */
        #result { margin-top: 30px; line-height: 1.6; }
        .data-point { background: #f1f8e9; padding: 10px 15px; border-radius: 8px; margin: 8px 0; border-left: 5px solid #7cb342; font-size: 1.1rem; }
        .data-point.temp { border-color: #e53935; background: #ffebee; }
        .data-point.rain { border-color: #1e88e5; background: #e3f2fd; }
        .data-point.soil { border-color: #8d6e63; background: #efebe9; }
        .recommendation-box { background: #e8f5e9; padding: 20px; border-radius: 12px; margin-top: 20px; border: 2px solid #66bb6a; }
        .recommendation-box h4 { color: #2e7d32; font-size: 1.4rem; margin-bottom: 10px; }
        .loading { text-align: center; color: #1565c0; font-weight: bold; font-size: 1.2rem; margin-top: 20px; }

        /* AUTH & CHAT STYLES */
        .auth-container { text-align: center; padding: 30px 20px; background: #f9f9f9; border-radius: 12px; border: 1px solid #e0e0e0; }
        #login-btn { background: #db4437; max-width: 250px; margin: 15px auto; display: block; padding: 14px; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(219, 68, 55, 0.4); }
        #logout-btn { background: #757575; padding: 8px 16px; width: auto; font-size: 14px; float: right; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: -5px; }
        
        .chat-container { background: #f9f9f9; border-radius: 12px; padding: 20px; border: 1px solid #e0e0e0; }
        .chat-messages { height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; border: 1px solid #ccc; padding: 15px; border-radius: 8px; background: #ffffff; }
        .message { padding: 10px 14px; border-radius: 15px; font-size: 0.95rem; max-width: 85%; line-height: 1.4; }
        .msg-other { background: #f1f8e9; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #c8e6c9; }
        .msg-you { background: #e3f2fd; align-self: flex-end; border-bottom-right-radius: 2px; border: 1px solid #bbdefb; }
        
        .chat-input-area { display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; outline: none; }
        .chat-input-area button { margin-top: 0; width: auto; padding: 12px 24px; background: #1565c0; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

        <button class="hamburger" onclick="toggleMenu()">☰ Menu</button>
        <div class="dropdown" id="nav-dropdown">
            <button onclick="switchView('home')">🏠 Home</button>
            <button onclick="switchView('chat')">💬 Farmer Chat</button>
        </div>
    </div>

    <div class="card">
        
        <!-- ============================== -->
        <!-- HOME VIEW (NASA Crop Planner)  -->
        <!-- ============================== -->
        <div id="home-view" class="view-section active">
            <h1>🌱 Field Shift</h1>
            <p class="subtitle">NASA Data-Driven Crop Rotation Planner</p>
            
            <label for="location">Select Agricultural Zone:</label>

            </select>
            <button class="primary-btn" id="analyze-btn">Analyze NASA Satellite Data 🚀</button>

            <div id="result"></div>
        </div>


        <!-- ============================== -->
        <!-- CHAT VIEW (Community System)   -->
        <!-- ============================== -->
        <div id="chat-view" class="view-section">
            <h1 style="margin-bottom: 20px;">💬 Community</h1>
            
            <!-- AUTHENTICATION SECTION -->
            <div id="auth-section" class="auth-container">
                <h3 style="margin-top: 0; border: none;">🔒 Farmer Login</h3>
                <p style="color: #666;">Sign in to chat with other farmers in your region.</p>
                <button id="login-btn">Sign in with Google</button>
            </div>

            <!-- COMMUNITY CHAT SECTION (Hidden until logged in) -->
            <div id="chat-section" style="display: none;">
                <div class="chat-container">
                    <button id="logout-btn">Logout</button>
                    <h3 style="margin-top: 0; border-bottom: none;">Regional Chat</h3>
                    <p id="welcome-msg" style="font-size: 0.9rem; color: #666; margin-bottom: 15px;"></p>
                    
                    <div class="chat-messages" id="chat-messages">
                        <!-- Messages load here -->
                    </div>
                    
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Share an update...">
                        <button id="send-btn">Send</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- UI JAVASCRIPT -->
    <script>
        // Toggle the dropdown menu visibility
        function toggleMenu() {
            document.getElementById('nav-dropdown').classList.toggle('show');
        }

        // Switch between Home and Chat views
        function switchView(viewName) {
            document.getElementById('home-view').classList.remove('active');
            document.getElementById('chat-view').classList.remove('active');
            document.getElementById(viewName + '-view').classList.add('active');
            
            // Hide the menu after clicking
            document.getElementById('nav-dropdown').classList.remove('show');
        }

        // Close menu if user clicks anywhere outside of it
        window.onclick = function(event) {
            if (!event.target.matches('.hamburger')) {
                var dropdowns = document.getElementsByClassName("dropdown");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
    </script>
