<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriShift - NASA Space Apps</title>
    <style>
        /* Base Reset & Font */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #2e7d32 0%, #1565c0 100%);
            color: #333; 
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Frosted Glass Card */
        .card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px; 
            border-radius: 16px; 
            max-width: 600px; 
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Typography & Colors */
        h1 { color: #1565c0; font-size: 2.2rem; margin-bottom: 5px; }
        .subtitle { color: #555; font-size: 1.1rem; margin-bottom: 25px; font-weight: 500; }
        h3 { color: #2e7d32; margin-top: 25px; border-bottom: 2px solid #e0e0e0; padding-bottom: 8px; }
        
        /* Inputs & Buttons */
        label { font-weight: bold; color: #444; display: block; margin-bottom: 8px; }
        select { 
            width: 100%; 
            padding: 12px; 
            font-size: 16px; 
            border-radius: 8px; 
            border: 2px solid #ccc;
            outline: none;
            transition: border-color 0.3s;
        }
        
        button { 
            width: 100%; 
            padding: 14px; 
            margin-top: 20px; 
            font-size: 18px; 
            font-weight: bold;
            background: linear-gradient(90deg, #ff8f00, #ffb300); 
            color: white; 
            border: none; 
            cursor: pointer; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(255, 143, 0, 0.4);
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }

        /* Results Styling */
        #result { margin-top: 30px; line-height: 1.6; }
        .data-point {
            background: #f1f8e9; padding: 10px 15px; border-radius: 8px;
            margin: 8px 0; border-left: 5px solid #7cb342; font-size: 1.1rem;
        }
        .data-point.temp { border-color: #e53935; background: #ffebee; }
        .data-point.rain { border-color: #1e88e5; background: #e3f2fd; }
        .data-point.soil { border-color: #8d6e63; background: #efebe9; }

        .recommendation-box {
            background: #e8f5e9; padding: 20px; border-radius: 12px;
            margin-top: 20px; border: 2px solid #66bb6a;
        }
        .recommendation-box h4 { color: #2e7d32; font-size: 1.4rem; margin-bottom: 10px; }
        .loading { text-align: center; color: #1565c0; font-weight: bold; font-size: 1.2rem; margin-top: 20px; }

        /* COMMUNITY CHAT STYLES */
        .chat-container { margin-top: 40px; background: #f9f9f9; border-radius: 12px; padding: 20px; border: 1px solid #e0e0e0; }
        .chat-messages { 
            height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; 
            margin-bottom: 15px; border: 1px solid #ccc; padding: 15px; border-radius: 8px; background: #ffffff;
        }
        .message { padding: 10px 14px; border-radius: 15px; font-size: 0.95rem; max-width: 85%; line-height: 1.4; }
        .msg-other { background: #f1f8e9; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #c8e6c9; }
        .msg-you { background: #e3f2fd; align-self: flex-end; border-bottom-right-radius: 2px; border: 1px solid #bbdefb; }
        
        .chat-input-area { display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; outline: none; }
        .chat-input-area button { margin-top: 0; width: auto; padding: 12px 24px; background: #1565c0; box-shadow: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌱 Field Shift</h1>
        <p class="subtitle">NASA Data-Driven Crop Rotation Planner</p>
        
        <label for="location">Select Agricultural Zone:</label>
        <select id="location">
            <option value="Anuradhapura">Anuradhapura (Dry Zone)</option>
            <option value="Polonnaruwa">Polonnaruwa (Dry Zone)</option>
            <option value="Hambantota">Hambantota (Dry Zone)</option>
        </select>
        <button id="analyze-btn">Analyze NASA Satellite Data 🚀</button>

        <div id="result"></div>

        <!-- COMMUNITY CHAT SECTION -->
        <div class="chat-container">
            <h3 style="margin-top: 0; border-bottom: none;">💬 Regional Farmer Chat</h3>
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 15px;">Live community discussion board.</p>
            
            <div class="chat-messages" id="chat-messages">
                <!-- Messages will load here from Firebase -->
            </div>
            
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Share an update...">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE AND APP LOGIC -->
    <script type="module">
        // 1. Import Firebase core and database modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // ==========================================
        // 2. YOUR FIREBASE CONFIGURATION
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDK21oehkpfOod71xZxiRiPRjTjb2JVh60",
            authDomain: "agrishift-9f2dc.firebaseapp.com",
            databaseURL: "https://agrishift-9f2dc-default-rtdb.asia-southeast1.firebasedatabase.app", // <-- I added this line so the DB works!
            projectId: "agrishift-9f2dc",
            storageBucket: "agrishift-9f2dc.firebasestorage.app",
            messagingSenderId: "841675381324",
            appId: "1:841675381324:web:60d19b1781b6d0592eb2e9",
            measurementId: "G-ZTLCX9J20Y"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatRef = ref(db, "messages");

        // Generate a random user ID for this browser session so we know which messages are "You"
        const myUserId = "user_" + Math.floor(Math.random() * 10000);

        // ==========================================
        // 3. CHAT LOGIC (Sending & Receiving)
        // ==========================================
        const msgBox = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');

        // Function to send message to Firebase
        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            
            // Push message to Firebase database
            push(chatRef, {
                userId: myUserId,
                text: text,
                timestamp: serverTimestamp()
            });
            chatInput.value = ''; // Clear input
        }

        // Listen for new messages added to Firebase in real-time
        onChildAdded(chatRef, (snapshot) => {
            const data = snapshot.val();
            const newMsg = document.createElement('div');
            
            // If the message was sent by this device, style it as "msg-you", otherwise "msg-other"
            if (data.userId === myUserId) {
                newMsg.className = 'message msg-you';
                newMsg.innerHTML = `<strong>You:</strong> ${data.text}`;
            } else {
                newMsg.className = 'message msg-other';
                newMsg.innerHTML = `<strong>Farmer:</strong> ${data.text}`;
            }
            
            msgBox.appendChild(newMsg);
            msgBox.scrollTop = msgBox.scrollHeight; // Auto-scroll to bottom
        });

        // Event Listeners for Chat
        document.getElementById('send-btn').addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // ==========================================
        // 4. CROP PLANNER LOGIC (Connected to Vercel Python API)
        // ==========================================
        document.getElementById('analyze-btn').addEventListener('click', async () => {
            const loc = document.getElementById('location').value;
            const resDiv = document.getElementById('result');
            resDiv.innerHTML = "<div class='loading'>📡 Accessing NASA POWER Climatology Data...</div>";
            
            try {
                const response = await fetch(`/api/crop-plan?location=${loc}`);
                const data = await response.json();
                
                if(data.error) {
                    resDiv.innerHTML = `<p style='color:red; font-weight:bold;'>Error: ${data.error}</p>`;
                    return;
                }

                resDiv.innerHTML = `
                    <h3>🛰️ Live Satellite Analysis</h3>
                    <div class="data-point temp">🌡️ <strong>Temperature:</strong> ${data.temperature} °C</div>
                    <div class="data-point rain">🌧️ <strong>Precipitation:</strong> ${data.precipitation} mm/day</div>
                    <div class="data-point soil">💧 <strong>Soil Wetness:</strong> ${data.soil_moisture} Index</div>
                    
                    <div class="recommendation-box">
                        <h4>✅ Optimal Crop: ${data.recommendation}</h4>
                        <p><strong>Agricultural Insight:</strong> ${data.reason}</p>
                    </div>
                `;
            } catch (error) {
                resDiv.innerHTML = "<p style='color:red; font-weight:bold;'>Error establishing connection to telemetry server.</p>";
            }
        });
    </script>
</body>
</html>
